---
apiVersion: apps.openshift.io/v1
kind: DeploymentConfig
metadata:
  name: {{ include "carbone.fullname" . }}
  labels: {{- include "carbone.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 10
  selector: {{- include "carbone.selectorLabels" . | nindent 4 }}
  strategy:
    resources: {}
    rollingParams:
      timeoutSeconds: 600
    type: Rolling
  template:
    metadata:
      labels: {{ include "carbone.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: app
          {{- with .Values.securityContext }}
          securityContext: {{ toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}/{{ .Chart.Name }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: {{ .Values.route.path }}/status
              port: {{ .Values.service.port }}
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 1
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: {{ .Values.route.path }}/status
              port: {{ .Values.service.port }}
              scheme: HTTP
            initialDelaySeconds: 10
            timeoutSeconds: 1
          resources: {{ toYaml .Values.resources | nindent 12 }}
          env:
            - name: CARBONE_EE_WORKDIR
              value: /tmp
            - name: CARBONE_EE_LICENSE
              valueFrom:
                secretKeyRef:
                  name: {{ include "carbone.configname" . }}-license
                  key: license
          volumeMounts:
            - mountPath: /tmp/template
              name: carbone-storage
              subPath: template
            - mountPath: /tmp/render
              name: carbone-storage
              subPath: render
      volumes:
        - name: carbone-storage
        {{- if .Values.persistentVolumeClaim.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "carbone.configname" . }}-pvc
        {{- else }}
          emptyDir: {}
        {{- end }}
  test: false
  triggers:
    - type: ConfigChange

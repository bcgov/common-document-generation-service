---
apiVersion: v1
kind: Service
metadata:
  name: {{include "carbone.fullname" .}}
  labels: {{- include "carbone.labels" . | nindent 4}}
spec:
  type: {{.Values.service.type}}
  ports:
    - name: {{.Values.service.portName}}
      port: {{.Values.service.port}}
      protocol: TCP
      targetPort: {{.Values.service.port}}
  selector: {{- include "carbone.selectorLabels" . | nindent 4}}

{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openshift-ingress-to-{{ include "carbone.configname" . }}-app
  labels:
    {{- include "carbone.labels" . | nindent 4 }}
spec:
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - port: {{ default "4000" .Values.service.port | atoi }}
          protocol: TCP
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Values.networkPolicy.allowedInstance | quote }}
      ports:
        - port: {{ default "4000" .Values.service.port | atoi }}
          protocol: TCP
  podSelector:
    matchLabels: {{- include "carbone.selectorLabels" . | nindent 6 }}
{{- end }}
